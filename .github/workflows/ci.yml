name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore Spracher.slnx

      - name: Verify formatting
        run: dotnet format Spracher.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Spracher.slnx --configuration Release --no-restore

      - name: Test
        env:
          RUN_INTEGRATION_TESTS: "true"
        run: dotnet test Spracher.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
