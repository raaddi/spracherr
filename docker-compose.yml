name: spracher

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spracher}
      POSTGRES_USER: ${POSTGRES_USER:-spracher}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env from .env.example and set POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spracher} -d ${POSTGRES_DB:-spracher}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  migrations:
    build:
      context: .
      dockerfile: src/Spracher.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Application__PublicUrl: http://localhost:${WEB_PORT:-8080}
      Email__Mode: Development
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-spracher};Username=${POSTGRES_USER:-spracher};Password=${POSTGRES_PASSWORD}"
    command: ["--migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: src/Spracher.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Application__PublicUrl: http://localhost:${WEB_PORT:-8080}
      Email__Mode: Development
      DataProtection__KeysPath: /var/lib/spracher/dataprotection-keys
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-spracher};Username=${POSTGRES_USER:-spracher};Password=${POSTGRES_PASSWORD}"
    expose:
      - "8080"
    volumes:
      - dataprotection-keys:/var/lib/spracher/dataprotection-keys
    depends_on:
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: src/Spracher.Web/Dockerfile
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data:
  dataprotection-keys:
